<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unconscious Mind Study</title>
<style>
  :root {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #222220; --line: #33332f; --grid: #2a2a27; --chip: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --accent-ink: #ffffff;
    --g-beach: #d95926; --g-football: #199e70; --g-none: #3987e5;
    --good: #0ca30c; --warning: #fab219; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--text-primary);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  code { background: var(--chip); padding: 1px 6px; border-radius: 5px; font-size: .9em; }

  /* ===================== experiment ===================== */
  .exp h1 { font-size: 1.6rem; margin: 0 0 .6rem; letter-spacing: -.01em; }
  .exp h2 { font-size: 1.1rem; margin: 1rem 0 .3rem; }
  .exp p { margin: .5rem 0; }
  .muted { color: var(--text-muted); } .small { font-size: .85rem; }
  .ok { color: var(--good); } .bad { color: var(--critical); font-weight: 600; }
  .eyebrow { text-transform: uppercase; font-size: .75rem; letter-spacing: .08em; color: var(--warning); margin: 0 0 .4rem; font-weight: 600; }

  .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; }
  .exp .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 32px; width: 100%; max-width: 640px; }
  .exp .card.wide { max-width: 820px; }
  ul.consent, ol.steps { padding-left: 1.2rem; } ul.consent li, ol.steps li { margin: .45rem 0; }

  button { font: inherit; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-primary); padding: .55rem 1rem; border-radius: 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--text-muted); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .exp button.primary { margin-top: 1rem; }
  button.big { padding: .8rem 1.4rem; font-size: 1.05rem; }
  button.danger { color: var(--critical); }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  .withdraw { position: fixed; right: 16px; bottom: 16px; font-size: .85rem; color: var(--text-muted); background: transparent; }
  .exp-only { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px dashed var(--line); }
  .tabs { display: flex; gap: 8px; margin-bottom: 1.2rem; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .exp label { display: block; margin: .7rem 0; }
  .exp label small { color: var(--text-muted); }
  .exp input:not([type=checkbox]):not([type=radio]), .exp select, .exp textarea {
    display: block; width: 100%; margin-top: .3rem; font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); color: var(--text-primary); }
  .exp label.check, .exp label.radio { display: flex; gap: .6rem; align-items: flex-start; }
  .exp label.check input, .exp label.radio input { margin-top: .35rem; width: 1.05rem; height: 1.05rem; flex: none; accent-color: var(--accent); }
  .radios { display: flex; gap: 1.2rem; flex-wrap: wrap; } .radios label { margin: .4rem 0; }
  .q { margin: .7rem 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.2rem; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .exp .card { padding: 22px; } }
  .status { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: .8rem 1rem; margin: 1rem 0; font-size: .95rem; }
  .status > div { margin: .2rem 0; } .hint { color: var(--text-muted); font-size: .85rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.6rem 0 .6rem; }

  /* flicker stage: dark neutral gray, no cursor */
  canvas.stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #2a2a28; cursor: none; }

  /* choice screen */
  .choice { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: var(--page); }
  .question { font-size: 1.35rem; font-weight: 600; margin-bottom: 1.2rem; }
  .pair { display: flex; gap: min(4vw, 48px); justify-content: center; }
  .opt { padding: 0; border: 3px solid transparent; border-radius: 14px; overflow: hidden; background: var(--surface-2); width: min(40vw, 62vh); height: min(40vw, 62vh); }
  .opt:hover { border-color: var(--accent); }
  .opt img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }

  /* ===================== results dashboard ===================== */
  .dash { font-size: 15px; }
  .dash .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 64px; }
  .dash header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .dash header.top h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  .dash header.top .sub { color: var(--text-muted); font-size: .85rem; }
  .dash .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .dash button, .dash select { font: inherit; font-size: .88rem; background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .dash button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dash .filters { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: var(--surface-1);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; font-size: .88rem; }
  .dash .filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); white-space: nowrap; }
  .dash .filters input { accent-color: var(--accent); }
  .dash .filters .lbl { color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; font-weight: 600; }

  .dash .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .dash .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; min-width: 0; }
  .dash .s12 { grid-column: span 12; } .dash .s8 { grid-column: span 8; } .dash .s7 { grid-column: span 7; } .dash .s6 { grid-column: span 6; }
  .dash .s5 { grid-column: span 5; } .dash .s4 { grid-column: span 4; } .dash .s3 { grid-column: span 3; }
  @media (max-width: 980px) { .dash .s8, .dash .s7, .dash .s6, .dash .s5, .dash .s4 { grid-column: span 12; } .dash .s3 { grid-column: span 6; } }
  @media (max-width: 560px) { .dash .s3 { grid-column: span 12; } }
  .dash .card h2 { font-size: .98rem; margin: 0 0 2px; }
  .dash .card .desc { color: var(--text-muted); font-size: .82rem; margin: 0 0 12px; }
  .dash h3.section { grid-column: span 12; margin: 18px 0 -4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); }
  .dash p { margin: .5rem 0; }

  .dash .kpi .v { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .dash .kpi .l { color: var(--text-secondary); font-size: .84rem; display: flex; align-items: center; gap: 7px; }
  .dash .kpi .m { color: var(--text-muted); font-size: .8rem; margin-top: 2px; }
  .dash .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .dash .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--text-secondary); margin: 0 0 8px; }
  .dash .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .dash .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 860px) { .dash .verdicts { grid-template-columns: 1fr; } }
  .dash .verdict { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .dash .verdict .h { font-size: .8rem; color: var(--text-muted); }
  .dash .verdict .t { font-weight: 650; margin: 2px 0; }
  .dash .verdict .st { display: inline-flex; gap: 6px; align-items: center; font-weight: 650; font-size: .9rem; }
  .dash .st.good { color: var(--good); } .dash .st.bad { color: var(--critical); } .dash .st.warn { color: var(--warning); }
  .dash .verdict .d { color: var(--text-secondary); font-size: .82rem; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .dash svg { display: block; width: 100%; height: auto; overflow: visible; }
  .dash svg text { fill: var(--text-muted); font-size: 12px; font-family: inherit; }
  .dash svg .lab { fill: var(--text-secondary); }
  .dash svg .val { fill: var(--text-primary); font-weight: 600; }
  .dash svg .grid line { stroke: var(--grid); }
  .dash svg .axis { stroke: var(--line); }
  .dash svg .ref { stroke: var(--text-muted); stroke-dasharray: 4 4; }
  .dash svg .mark:hover { filter: brightness(1.2); }

  .dash table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  .dash th, .dash td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dash th { color: var(--text-muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .dash th.sort { cursor: pointer; } .dash th.sort:hover { color: var(--text-primary); }
  .dash td.num, .dash th.num { text-align: right; }
  .dash tr.excluded td { opacity: .45; }
  .dash .card .body { overflow-x: auto; }
  .dash .scroll td { white-space: nowrap; }
  .dash .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .dash .tag { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--text-secondary); margin: 1px 3px 1px 0; white-space: nowrap; }
  .dash .tag.flag { color: var(--warning); }
  .dash .pill { display: inline-flex; align-items: center; gap: 6px; }
  .dash .small { font-size: .82rem; }
  .dash .report { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: .9rem; line-height: 1.6; }

  .dash .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 48px 24px; text-align: center; background: var(--surface-1); }
  .dash .drop.over { border-color: var(--accent); }
  .dash .drop h2 { margin: 0 0 6px; }
  .dash .drop p { color: var(--text-secondary); margin: 6px 0; }
  .dash .drop .actions { justify-content: center; margin-top: 16px; }

  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-primary);
    border-radius: 8px; padding: 7px 10px; font-size: .82rem; box-shadow: 0 6px 20px rgba(0,0,0,.45); max-width: 300px; display: none; }
  #tip .tv { font-weight: 650; color: var(--text-primary); }
  #tip .tl { color: var(--text-secondary); }
</style>
</head>
<body>
  <div id="root"><div class="exp"><div class="page"><div class="card">
    <h1>Loading…</h1>
    <noscript>Please enable JavaScript.</noscript>
    <p class="muted">If this message stays, make sure the whole folder was downloaded (not just this file) and open it in Google Chrome.</p>
  </div></div></div></div>

  <!-- Everything is local: works offline, nothing to install. -->
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <script src="lib/htm.umd.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
