<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unconscious Mind Study</title>
<style>
  :root {
    --bg: #f3f2ee; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdad3;
    --accent: #2f5d8a; --accent-ink: #ffffff; --bad: #b3261e; --ok: #1f7a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #root { min-height: 100%; }
  h1 { font-size: 1.6rem; margin: 0 0 .6rem; letter-spacing: -.01em; }
  h2 { font-size: 1.1rem; margin: 1rem 0 .3rem; }
  p { margin: .5rem 0; }
  .muted { color: var(--muted); } .small { font-size: .85rem; }
  .ok { color: var(--ok); } .bad { color: var(--bad); font-weight: 600; }
  .eyebrow { text-transform: uppercase; font-size: .75rem; letter-spacing: .08em; color: var(--bad); margin: 0 0 .4rem; font-weight: 600; }

  .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; position: relative; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; width: 100%; max-width: 640px; }
  .card.wide { max-width: 820px; }
  ul.consent, ol.steps { padding-left: 1.2rem; } ul.consent li, ol.steps li { margin: .45rem 0; }

  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: .55rem 1rem; border-radius: 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: #a9a69c; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); margin-top: 1rem; }
  button.big { padding: .8rem 1.4rem; font-size: 1.05rem; }
  button.danger { color: var(--bad); }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; }
  .withdraw { position: fixed; right: 16px; bottom: 16px; font-size: .85rem; color: var(--muted); background: transparent; }
  .exp-only { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px dashed var(--line); }

  label { display: block; margin: .7rem 0; }
  label small { color: var(--muted); }
  input:not([type=checkbox]):not([type=radio]), select, textarea {
    display: block; width: 100%; margin-top: .3rem; font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  label.check, label.radio { display: flex; gap: .6rem; align-items: flex-start; }
  label.check input, label.radio input { margin-top: .35rem; width: 1.05rem; height: 1.05rem; flex: none; }
  .radios { display: flex; gap: 1.2rem; flex-wrap: wrap; } .radios label { margin: .4rem 0; }
  .q { margin: .7rem 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.2rem; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .card { padding: 22px; } }
  .status { background: #f7f6f2; border: 1px solid var(--line); border-radius: 10px; padding: .8rem 1rem; margin: 1rem 0; font-size: .95rem; }
  .status > div { margin: .2rem 0; } .hint { color: var(--muted); font-size: .85rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.6rem 0 .6rem; }

  /* flicker stage: neutral gray, no cursor */
  canvas.stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #808080; cursor: none; }

  /* choice screen */
  .choice { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; background: var(--bg); }
  .question { font-size: 1.35rem; font-weight: 600; margin-bottom: 1.2rem; }
  .pair { display: flex; gap: min(4vw, 48px); justify-content: center; }
  .opt { padding: 0; border: 3px solid transparent; border-radius: 14px; overflow: hidden; background: #ddd; width: min(40vw, 62vh); height: min(40vw, 62vh); }
  .opt:hover { border-color: var(--accent); }
  .opt img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }
</style>
</head>
<body>
  <div id="root"><div class="page"><div class="card">
    <h1>Loading…</h1>
    <noscript>Please enable JavaScript.</noscript>
    <p class="muted">If this message stays, make sure the whole folder was downloaded (not just this file) and open it in Google Chrome.</p>
  </div></div></div>

  <!-- Everything is local: works offline, nothing to install. -->
  <script src="lib/react.production.min.js"></script>
  <script src="lib/react-dom.production.min.js"></script>
  <script src="lib/htm.umd.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
