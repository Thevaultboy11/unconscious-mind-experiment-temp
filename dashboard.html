<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Results Dashboard</title>
<style>
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121211; --surface-1: #1a1a19; --surface-2: #222220; --line: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5;
    --g-beach: #d95926; --g-football: #199e70; --g-none: #3987e5;
    --good: #0ca30c; --warning: #fab219; --critical: #e66767;
    --chip: #2a2a27;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f3f2ee; --surface-1: #fcfcfb; --surface-2: #f3f2ee; --line: #dcdad3; --grid: #ebe9e3;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7973;
    --accent: #2a78d6;
    --g-beach: #eb6834; --g-football: #1baf7a; --g-none: #2a78d6;
    --good: #006300; --warning: #9a6b00; --critical: #d03b3b;
    --chip: #ebe9e3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  header.top h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  header.top .sub { color: var(--text-muted); font-size: .85rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn, select { font: inherit; font-size: .88rem; background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, .btn:hover { border-color: var(--text-muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=file] { display: none; }

  .banner { border: 1px solid var(--warning); color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent);
    border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; font-weight: 600; font-size: .9rem; }
  .filters { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: var(--surface-1);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; font-size: .88rem; }
  .filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); white-space: nowrap; }
  .filters .lbl { color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 14px; min-width: 0; }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; }
  .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s3 { grid-column: span 3; }
  @media (max-width: 980px) { .s8, .s7, .s6, .s5, .s4 { grid-column: span 12; } .s3 { grid-column: span 6; } }
  @media (max-width: 560px) { .s3 { grid-column: span 12; } }
  .card h2 { font-size: .98rem; margin: 0 0 2px; }
  .card .desc { color: var(--text-muted); font-size: .82rem; margin: 0 0 12px; }
  h3.section { grid-column: span 12; margin: 18px 0 -4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--text-muted); }

  .kpi .v { font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .kpi .l { color: var(--text-secondary); font-size: .84rem; display: flex; align-items: center; gap: 7px; }
  .kpi .m { color: var(--text-muted); font-size: .8rem; margin-top: 2px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--text-secondary); margin: 0 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 860px) { .verdicts { grid-template-columns: 1fr; } }
  .verdict { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
  .verdict .h { font-size: .8rem; color: var(--text-muted); }
  .verdict .t { font-weight: 650; margin: 2px 0; }
  .verdict .st { display: inline-flex; gap: 6px; align-items: center; font-weight: 650; font-size: .9rem; }
  .st.good { color: var(--good); } .st.bad { color: var(--critical); } .st.warn { color: var(--warning); }
  .verdict .d { color: var(--text-secondary); font-size: .82rem; margin-top: 4px; font-variant-numeric: tabular-nums; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-muted); font-size: 12px; font-family: inherit; }
  svg .lab { fill: var(--text-secondary); }
  svg .val { fill: var(--text-primary); font-weight: 600; }
  svg .grid line { stroke: var(--grid); }
  svg .axis { stroke: var(--line); }
  svg .ref { stroke: var(--text-muted); stroke-dasharray: 4 4; }
  svg [data-tip] { cursor: default; }
  svg .hit:hover + .mark, svg .mark:hover { filter: brightness(1.2); }

  table { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--text-primary); }
  td.num, th.num { text-align: right; }
  tr.excluded td { opacity: .45; }
  .card .body { overflow-x: auto; }
  .scroll td { white-space: nowrap; } .scroll td:last-child { white-space: nowrap; }
  .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .tag { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--text-secondary); margin: 1px 3px 1px 0; white-space: nowrap; }
  .tag.flag { color: var(--warning); }
  .pill { display: inline-flex; align-items: center; gap: 6px; }
  .muted { color: var(--text-muted); } .small { font-size: .82rem; }
  .report { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: .9rem; line-height: 1.6; }

  .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 48px 24px; text-align: center; background: var(--surface-1); }
  .drop.over { border-color: var(--accent); }
  .drop h2 { margin: 0 0 6px; }
  .drop p { color: var(--text-secondary); margin: 6px 0; }
  .drop .actions { justify-content: center; margin-top: 16px; }

  #tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: .82rem; box-shadow: 0 6px 20px rgba(0,0,0,.35); max-width: 300px; display: none; }
  #tip .tv { font-weight: 650; color: var(--text-primary); }
  #tip .tl { color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <div id="tip"></div>
  <input type="file" id="file" accept=".csv,text/csv" multiple />
  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
